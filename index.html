<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>在线答题卡丨申论格子纸语文作文纸</title>
  <style>
    /* ---------- 1. 错误提示（轻量、淡入淡出） ---------- */
    .error-message {
      color: #b71c1c;
      background-color: #fff3f3;
      border-left: 4px solid #c62828;
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
      margin: 10px 0;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-size: 14px;
      line-height: 1.5;
      text-align: left;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .error-message.show {
      display: block;
      opacity: 1;
    }

    /* ---------- 8. 全局焦点样式 ---------- */
    *:focus-visible {
      outline: 2px solid #1976d2;
      outline-offset: 2px;
    }

    /* ---------- 打印 ---------- */
    @page { margin: 10mm; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .container {
      text-align: center;
      width: 100%;
      margin-top: 10px;
    }

    /* ---------- 5. 字体层级 ---------- */
    .guide-title {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .guide {
      display: block;
      margin-top: 4px;
      margin-bottom: 10px;
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    /* 移动端引导提示 */
    .mobile-hint {
      display: none;
      background: #fff8e1;
      border: 1px solid #ffcc80;
      border-radius: 6px;
      padding: 10px 14px;
      margin: 8px auto;
      font-size: 13px;
      color: #e65100;
      max-width: 600px;
      text-align: left;
    }

    @media print {
      @page { margin: 8mm; }

      .guide-title, .guide, .editable-div, .buttons, .adjust-buttons,
      .error-message, .mobile-hint, .size-buttons,
      .count-target-group, .count-annotation {
        display: none !important;
      }
      body {
        display: block !important;
        width: 100%;
        height: auto;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container { margin-top: 0; overflow: visible; }
      .container .grid-container {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        padding: 0;
        grid-template-columns: repeat(25, minmax(0, 1fr));
        grid-template-rows: auto;
        overflow: visible;
      }
      .grid-container .grid-item {
        box-sizing: border-box;
        overflow: hidden;
        width: auto;
        height: auto;
        padding: 1px;
        font-size: 17px;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .grid-container .grid-item:nth-child(100n)::after {
        right: 0;
        font-size: 8px;
        bottom: -10px;
        transform: translateX(100%);
        padding-right: 1px;
        max-width: 18px;
      }
    }

    /* ---------- 2. 格子线颜色降饱和；标记类背景统一走 CSS 变量（打印态强制置空） ---------- */
    :root {
      --grid-color: #c62828;
      --content-font-size: 18px;
      --marker-space-directive-bg: rgba(198, 40, 40, 0.05);
      --marker-layout-space-bg: rgba(198, 40, 40, 0.02);
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(25, auto);
      column-gap: 0;
      row-gap: 8px;
      justify-content: center;
      margin-top: 20px;
      transition: box-shadow 0.3s ease;
      border-radius: 4px;
      padding: 4px;
      contain: layout paint;
    }
    /* 3. 输入框 focus 时格子区高亮 */
    .grid-container.focus-highlight {
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
    }
    .grid-item {
      border-top: 1px solid var(--grid-color);
      border-left: 1px solid var(--grid-color);
      border-bottom: 1px solid var(--grid-color);
      padding: 5px;
      text-align: center;
      font-size: calc(var(--content-font-size) + 2px);
      width: 1.1em;
      height: 1.1em;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .grid-item:hover {
      background-color: #f0f8ff;
    }
    /* 7. +N+ 空格视觉标记（缩进阴影终态：纯色唯一默认，斜纹退役） */
    .grid-item.space-directive {
      background-color: var(--marker-space-directive-bg);
    }
    /* F1 视觉区分已按用户 2026-10-13 真机反馈移除（行末同格合并是自然排版，无需提醒）。
       .merge-eol 类名保留供测试/逻辑引用，不携带任何视觉样式。 */
    .grid-item:nth-child(25n) { border-right: 1px solid var(--grid-color); }
    .grid-item:nth-child(100n) {
      border-right: 2px solid var(--grid-color);
      position: relative;
    }
    .grid-item:nth-child(100n)::after {
      content: attr(data-index);
      color: var(--grid-color);
      font-size: 10px;
      font-weight: normal;
      position: absolute;
      right: 0;
      bottom: -12px;
      transform: translateX(100%);
      padding-right: 2px;
      text-align: right;
      width: max-content;
      max-width: 22px;
      overflow: hidden;
    }

    /* ---------- 3. 输入框 ---------- */
    .editable-div {
      width: 40%;
      height: 250px;
      margin-bottom: 10px;
      font-size: var(--content-font-size);
      border: 1px solid #ccc;
      padding: 8px 10px;
      white-space: pre-wrap;
      overflow: auto;
      text-align: left;
      resize: both;
      border-radius: 4px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      contain: layout;
      will-change: width, height;
    }
    .editable-div:focus {
      border-color: #1976d2;
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
      outline: none;
    }
    .editable-div .directive {
      color: #1565c0;
      font-weight: 500;
    }

    /* ---------- 1. 按钮三级体系 ---------- */
    button {
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
      border-radius: 4px;
      padding: 6px 14px;
      line-height: 1.4;
    }
    button:active {
      transform: translateY(1px);
    }
    .btn-primary {
      background-color: #1976d2;
      color: #fff;
      border: 1px solid #1976d2;
    }
    .btn-primary:hover {
      background-color: #1565c0;
      border-color: #1565c0;
    }
    .btn-secondary {
      background-color: #fff;
      color: #37474f;
      border: 1px solid #b0bec5;
    }
    .btn-secondary:hover {
      background-color: #eceff1;
      border-color: #90a4ae;
    }
    .btn-danger {
      background-color: #fff;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }
    .btn-danger:hover {
      background-color: #ffebee;
      border-color: #ef5350;
    }
    .btn-text {
      background: transparent;
      color: #546e7a;
      border: 1px solid transparent;
      padding: 6px 10px;
    }
    .btn-text:hover {
      background-color: #f5f5f5;
    }

    .buttons {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .count-display {
      margin-left: 10px;
      font-size: 14px;
      font-weight: 600;
      padding: 6px 10px;
      border: 1px solid #cfd8dc;
      border-radius: 4px;
      background-color: #f5f7fa;
      color: #37474f;
    }
    .input-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .size-buttons {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
      gap: 6px;
    }

    /* 自动输入状态按钮 */
    .auto-on {
      background-color: #2e7d32;
      color: white;
      border: 1px solid #2e7d32;
    }
    .auto-on:hover { background-color: #1b5e20; }
    .auto-off {
      background-color: #c62828;
      color: white;
      border: 1px solid #c62828;
    }
    .auto-off:hover { background-color: #b71c1c; }

    /* 光标高亮 */
    .cursor-highlight {
      background-color: rgba(255, 235, 59, 0.5);
      animation: blink 1s infinite;
    }
    @keyframes blink {
      50% { background-color: rgba(255, 235, 59, 0.2); }
    }

    /* ---------- 9. 移动端适配 ---------- */
    @media (max-width: 768px) {
      .editable-div { width: 90%; }
      .grid-item { font-size: calc(var(--content-font-size) - 2px); }
      .buttons { gap: 6px; }
      button { padding: 5px 10px; font-size: 12px; }
      .mobile-hint { display: block; }
      .grid-container {
        justify-content: flex-start;
        overflow-x: auto;
        min-width: 100%;
        padding-bottom: 12px;
      }
      .guide-title { font-size: 18px; }
    }



    /* ---------- Word count target ---------- */
    .count-target-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .count-target-input {
      width: 70px;
      padding: 4px 8px;
      border: 1px solid #cfd8dc;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
      font-family: inherit;
    }
    .count-display.over-target {
      color: #c62828;
      border-color: #ef9a9a;
      background-color: #ffebee;
    }
    .count-annotation {
      font-size: 12px;
      color: #78909c;
      margin-top: 6px;
      text-align: center;
    }


    /* v9: 宽符号与排版空位样式 */
    .grid-item.wide-symbol {
      /* 宽符号第一格，允许内容溢出到第二格 */
      overflow: visible;
      z-index: 1;
    }
    .grid-item.wide-second {
      /* 宽符号第二格占位，保持空 */
      color: transparent;
    }
    .grid-item.layout-space {
      /* 排版空位：视觉上为空，轻量背景提示 */
      background-color: var(--marker-layout-space-bg);
    }
    @media print {
      .grid-item.wide-symbol,
      .grid-item.wide-second {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      /* 打印纯净：一切标记类背景（淡底/黄标/未来新增标记类）强制无填充 */
      .grid-container .grid-item {
        background: none !important;
        background-color: transparent !important;
        background-image: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="guide-title">在线答题卡丨申论格子纸语文作文纸</div>
  <div class="guide" id="guide-desc">仅用于考试答题模拟，内容自动保存至浏览器本地存储，请及时导出备份。<br>【回车键】换行（自动空2格）、【空格键】空1格、【Tab键】空2格、【+N+】空N格</div>
  <div class="mobile-hint">提示：移动端格子较小，建议横屏使用或切换至桌面端以获得最佳体验。</div>
  <div class="error-message" id="error-message"></div>
  <div class="container">
    <div class="input-container">
      <div class="size-buttons adjust-buttons">
        <button class="btn-text" onclick="resetTextarea()">复原</button>
        <button class="btn-text" onclick="adjustTextarea('wide')">宽</button>
        <button class="btn-text" onclick="adjustTextarea('narrow')">窄</button>
        <button class="btn-text" onclick="adjustTextarea('tall')">高</button>
        <button class="btn-text" onclick="adjustTextarea('short')">低</button>
        <button class="btn-text" onclick="adjustFontSize(-1)">字小</button>
        <button class="btn-text" onclick="adjustFontSize(1)">字大</button>
      </div>
      <div id="input-text" class="editable-div" contenteditable="true"
           oninput="distributeTextWithDelay()" onkeydown="handleKeyDown(event)"
           aria-label="文本输入区" aria-describedby="guide-desc" role="textbox"></div>
    </div>
    <div class="buttons">
      <button class="btn-secondary" onclick="clearPlusN()">清除+N+</button>
      <button class="btn-secondary" onclick="clearNewLines()">清除换行</button>
      <button class="btn-secondary" onclick="clearSpaces()">清除空格</button>
      <button class="btn-danger" onclick="clearInput()">清空</button>
      <button class="btn-secondary" onclick="undo()">撤销</button>
      <button id="toggle-auto-input" class="auto-on" onclick="toggleAutoInput()">自动输入·开</button>
      <button class="btn-primary" onclick="distributeText()">填入答题纸</button>
      <button class="btn-secondary" onclick="downloadText()">导出TXT</button>
      <button class="btn-secondary" onclick="importText()">导入</button>
      <button class="btn-secondary" onclick="window.print()">打印</button>
      <div class="count-target-group">
        <div class="count-display" id="count-display">表格计数: 0</div>
        <div style="font-size:13px;color:#78909c;white-space:nowrap;">目标:
          <input type="number" class="count-target-input" id="count-target" min="0" placeholder="无" onchange="updateCountTarget()" oninput="updateCountTarget()">
        </div>
      </div>
    </div>
    <div class="grid-container" id="grid-container" role="grid" aria-label="答题格子纸"></div>
    <div class="count-annotation" id="count-annotation">「表格计数」= 实际占用格子数（含指令空格、行末合并格与排版空位），与纯字符数不同<br>申论规则：标点独占一格；行末无格时与末字同格（允许）；标点不出现在行首（前引号等除外）</div>
  </div>
  <script type="module">
    // ESM 收窄拆分（终局裁决 E）：排版引擎与规则表移入 js/，纯逻辑可被 Node import 测试。
    // 引用带版本 query（?v=20261013a）防缓存错位；版本号须与 js/ 内文件同批更新。
    import { GRID_COLUMNS_PER_ROW, computeGridContent, calculateEffectiveLength } from './js/engine.js?v=20261013a';
    import { DEFAULT_TEXT } from './js/default-text.js?v=20261013a';

    const MAX_IMPORT_TEXT_LENGTH = 100000;
    let updateTimeout;
    let autoInputEnabled = true;
    let errorTimeout;
    const initialWidth = '40%';
    const initialHeight = '250px';

    // v8 fix: resize 状态标志
    let isResizing = false;
    let resizeEndTimeout;

    // 新增：撤销历史记录
    const undoHistory = [];
    const MAX_UNDO_STEPS = 10;

    // v9: 分帧渲染控制
    let renderGeneration = 0;
    let isBatchRendering = false;
    const BATCH_RENDER_SIZE = 200;
    const LARGE_PASTE_THRESHOLD = 300;

    // v9: 标点分类规则已移至 js/punctuation-rules.js（ESM 拆分，可被 Node import 测试）

    function showError(message) {
      const errorElement = document.getElementById('error-message');
      if (errorTimeout) { clearTimeout(errorTimeout); }
      errorElement.innerText = message;
      errorElement.classList.add('show');
      errorTimeout = setTimeout(() => {
        errorElement.classList.remove('show');
        setTimeout(() => {
          if (!errorElement.classList.contains('show')) {
            errorElement.style.display = 'none';
          }
        }, 300);
      }, 5000);
    }

    function saveCaretPosition(container) {
      const selection = window.getSelection();
      if (selection.rangeCount === 0) return null;
      const range = selection.getRangeAt(0);
      const preRange = document.createRange();
      preRange.selectNodeContents(container);
      preRange.setEnd(range.startContainer, range.startOffset);
      return { start: preRange.toString().length, range: range };
    }

    function restoreCaretPosition(container, pos) {
      if (pos === null) return;
      const textNodes = getTextNodes(container);
      let total = 0;
      for (let node of textNodes) {
        const length = node.nodeValue.length;
        if (pos.start <= total + length) {
          const range = document.createRange();
          range.setStart(node, pos.start - total);
          range.collapse(true);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          container.focus();
          return;
        }
        total += length;
      }
      if (textNodes.length > 0) {
        const lastNode = textNodes[textNodes.length - 1];
        const range = document.createRange();
        range.setStart(lastNode, lastNode.nodeValue.length);
        range.collapse(true);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        container.focus();
      }
    }

    function getTextNodes(container) {
      const textNodes = [];
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
      while (walker.nextNode()) { textNodes.push(walker.currentNode); }
      return textNodes;
    }

    function highlightDirectives() {
      const inputTextDiv = document.getElementById('input-text');
      const directiveRegex = /\+\d+\+/;
      const walker = document.createTreeWalker(inputTextDiv, NodeFilter.SHOW_TEXT, null, false);
      const nodesToReplace = [];
      while (walker.nextNode()) {
        const node = walker.currentNode;
        // 走查19 修复：已在 .directive span 内的文本节点直接跳过，消除 span 无限嵌套
        if (node.parentElement && node.parentElement.classList &&
            node.parentElement.classList.contains('directive')) { continue; }
        if (directiveRegex.test(node.nodeValue)) { nodesToReplace.push(node); }
      }
      for (const node of nodesToReplace) {
        const text = node.nodeValue;
        const parts = text.split(/(\+\d+\+)/);
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < parts.length; i++) {
          if (parts[i]) {
            if (/^\+\d+\+$/.test(parts[i])) {
              const span = document.createElement('span');
              span.className = 'directive';
              span.textContent = parts[i];
              fragment.appendChild(span);
            } else {
              fragment.appendChild(document.createTextNode(parts[i]));
            }
          }
        }
        node.parentNode.replaceChild(fragment, node);
      }
    }

    function insertText(text) {
      try {
        const inputTextDiv = document.getElementById('input-text');
        const selection = window.getSelection();
        if (selection.rangeCount) {
          const range = selection.getRangeAt(0);
          range.deleteContents();
          const textNode = document.createTextNode(text);
          range.insertNode(textNode);
          range.setStartAfter(textNode);
          range.setEndAfter(textNode);
          selection.removeAllRanges();
          selection.addRange(range);
        }
        distributeTextWithDelay();
      } catch (error) { showError(`插入文本失败: ${error.message}`); }
    }

    function handleKeyDown(event) {
      if (event.isComposing) return;
      try {
        if (event.key === 'Enter') { event.preventDefault(); insertText('\n+2+'); }
        else if (event.key === 'Tab') { event.preventDefault(); insertText('+2+'); }
        else if (event.key === ' ') { event.preventDefault(); insertText(' '); }
      } catch (error) { showError(`按键处理错误: ${error.message}`); }
    }

    function clearNewLines() {
      try {
        const inputTextDiv = document.getElementById('input-text');
        const caretPos = saveCaretPosition(inputTextDiv);
        inputTextDiv.innerText = inputTextDiv.innerText.replace(/\n/g, '');
        highlightDirectives();
        distributeTextWithDelay();
        restoreCaretPosition(inputTextDiv, caretPos);
      } catch (error) { showError(`清除换行失败: ${error.message}`); }
    }

    function clearSpaces() {
      try {
        const inputTextDiv = document.getElementById('input-text');
        const caretPos = saveCaretPosition(inputTextDiv);
        inputTextDiv.innerText = inputTextDiv.innerText.replace(/ /g, '');
        highlightDirectives();
        distributeTextWithDelay();
        restoreCaretPosition(inputTextDiv, caretPos);
      } catch (error) { showError(`清除空格失败: ${error.message}`); }
    }

    function clearInput() {
      try {
        const inputTextDiv = document.getElementById('input-text');
        const caretPos = saveCaretPosition(inputTextDiv);
        inputTextDiv.innerText = '';
        highlightDirectives();
        distributeTextWithDelay();
        restoreCaretPosition(inputTextDiv, caretPos);
      } catch (error) { showError(`清空输入失败: ${error.message}`); }
    }

    function clearPlusN() {
      try {
        const inputTextDiv = document.getElementById('input-text');
        const caretPos = saveCaretPosition(inputTextDiv);
        inputTextDiv.innerText = inputTextDiv.innerText.replace(/\+\d+\+/g, '');
        highlightDirectives();
        distributeTextWithDelay();
        restoreCaretPosition(inputTextDiv, caretPos);
      } catch (error) { showError(`清除+N+指令失败: ${error.message}`); }
    }

    // v9: 分帧渲染的 distributeTextWithDelay
    function distributeTextWithDelay() {
      clearTimeout(updateTimeout);
      if (!autoInputEnabled) return;
      if (isResizing) return;
      const inputTextDiv = document.getElementById('input-text');
      const delayMs = 80;
      updateTimeout = setTimeout(() => {
        const caretPos = saveCaretPosition(inputTextDiv);
        try {
          distributeText();
          saveToLocalStorage();
          highlightDirectives();
        } catch (error) { showError(`文本处理失败: ${error.message}`); }
        finally { restoreCaretPosition(inputTextDiv, caretPos); }
      }, delayMs);
    }

    function saveToLocalStorage() {
      try {
        const text = document.getElementById('input-text').innerText;
        localStorage.setItem('savedText', text);
      } catch (error) { console.warn('本地存储不可用:', error.message); }
    }

    // 排版引擎（findPrevContentCell / placeWideSymbol / computeGridContent /
    // calculateEffectiveLength）已移至 js/engine.js，经顶部 import 引入

    function createGridItems(numItems) {
      const fragment = document.createDocumentFragment();
      for (let i = 0; i < numItems; i++) {
        const gridItem = document.createElement('div');
        gridItem.className = 'grid-item';
        if ((i + 1) % 100 === 0) {
          gridItem.setAttribute('data-index', i + 1);
        }
        fragment.appendChild(gridItem);
      }
      return fragment;
    }

    // v9: 同步更新已有格子及指定范围内的新格子
    function syncUpdateGridRange(gridContainer, startIdx, endIdx, result) {
      const gridItems = gridContainer.children;
      for (let i = startIdx; i < endIdx; i++) {
        const item = gridItems[i];
        const r = result[i];
        if (!r) {
          if (item.innerText !== '' || item.classList.length > 1 || item.dataset.sourceIndex) {
            item.innerText = '';
            item.removeAttribute('data-source-index');
            item.className = 'grid-item';
            item.removeAttribute('title');
          }
          continue;
        }
        if (item.innerText !== r.text) { item.innerText = r.text; }
        if (item.dataset.sourceIndex !== String(r.sourceIndex)) {
          item.dataset.sourceIndex = r.sourceIndex;
        }
        // 重置 class
        let cls = 'grid-item';
        if (r.isSpaceDirective) cls += ' space-directive';
        if (r.isWide) cls += ' wide-symbol';
        if (r.isWideSecond) cls += ' wide-second';
        if (r.isLayoutSpace) cls += ' layout-space';
        if (r.isMergedEOL) cls += ' merge-eol';
        if (item.className !== cls) { item.className = cls; }
        // F1 视觉区分（淡黄底 + tooltip）已按用户 2026-10-13 真机反馈移除；
        // merge-eol 类名保留供测试/逻辑引用，不携带任何视觉差异。此处仅做 title 兜底清理。
        if (item.title) { item.removeAttribute('title'); }
      }
    }

    // v9: 重写 distributeText —— 支持分帧渲染
    function distributeText() {
      try {
        // 清除待处理的撤销历史定时器，避免旧状态干扰
        clearTimeout(undoThrottleTimer);
        const inputTextDiv = document.getElementById('input-text');
        const text = inputTextDiv.innerText;
        const gridContainer = document.getElementById('grid-container');
        // 渲染竞态加固：任何一次 distribute 都取新一代号，使所有旧的分帧渲染循环立即失效
        // （否则负增长/同步快速路径不换代号，旧循环会在格子被删减后继续写格子并抛错）
        const gen = ++renderGeneration;

        // 计算内容
        const { result, gridIndex, warnings } = computeGridContent(text, Number.MAX_SAFE_INTEGER);
        // D5 歧义提示不静默：非平衡直引号等场景给用户一行可见提示
        if (warnings && warnings.length > 0) { showError(warnings.join('；')); }
        const numRows = Math.ceil(gridIndex / GRID_COLUMNS_PER_ROW);
        const numItems = numRows * GRID_COLUMNS_PER_ROW;

        // 立即更新字数统计（基于计算结果，与渲染进度无关）
        updateCountDisplay(gridIndex);

        // 增量管理格子数量
        const currentCount = gridContainer.childElementCount;
        const itemsToAdd = numItems - currentCount;

        // 如果是减少格子，直接同步处理
        if (itemsToAdd < 0) {
          const toRemove = -itemsToAdd;
          for (let i = 0; i < toRemove; i++) {
            gridContainer.removeChild(gridContainer.lastChild);
          }
          // 同步更新所有现有格子
          syncUpdateGridRange(gridContainer, 0, Math.min(gridIndex, numItems), result);
          // 清空多余格子
          for (let i = gridIndex; i < gridContainer.children.length; i++) {
            const item = gridContainer.children[i];
            if (item.innerText !== '' || item.classList.length > 1 || item.dataset.sourceIndex) {
              item.innerText = '';
              item.removeAttribute('data-source-index');
              item.className = 'grid-item';
            }
          }
          throttledAddToUndoHistory(text);
          document.getElementById('error-message').style.display = 'none';
          isBatchRendering = false;
          return;
        }

        // 如果新增格子数不超过阈值，走同步快速路径
        if (itemsToAdd <= LARGE_PASTE_THRESHOLD) {
          if (itemsToAdd > 0) {
            const fragment = createGridItems(itemsToAdd);
            gridContainer.appendChild(fragment);
          }
          syncUpdateGridRange(gridContainer, 0, gridIndex, result);
          for (let i = gridIndex; i < gridContainer.children.length; i++) {
            const item = gridContainer.children[i];
            if (item.innerText !== '' || item.classList.length > 1 || item.dataset.sourceIndex) {
              item.innerText = '';
              item.removeAttribute('data-source-index');
              item.className = 'grid-item';
            }
          }
          throttledAddToUndoHistory(text);
          document.getElementById('error-message').style.display = 'none';
          isBatchRendering = false;
          return;
        }

        // v9: 大文本粘贴 —— 分帧渲染（gen 已在函数入口取得）
        isBatchRendering = true;

        // 第一批：同步插入前 BATCH_RENDER_SIZE 个新格子，并更新已有格子
        const firstBatchNew = Math.min(itemsToAdd, BATCH_RENDER_SIZE);
        if (firstBatchNew > 0) {
          const fragment = createGridItems(firstBatchNew);
          gridContainer.appendChild(fragment);
        }
        const firstBatchTotal = currentCount + firstBatchNew;
        syncUpdateGridRange(gridContainer, 0, Math.min(gridIndex, firstBatchTotal), result);

        let renderedCount = firstBatchTotal;
        let lastYieldTime = performance.now();

        function renderNextBatch() {
          if (gen !== renderGeneration) { isBatchRendering = false; return; }

          const now = performance.now();
          // 每帧最多处理 BATCH_RENDER_SIZE 个新增格子
          const batchNew = Math.min(numItems - renderedCount, BATCH_RENDER_SIZE);
          if (batchNew > 0) {
            const fragment = createGridItems(batchNew);
            gridContainer.appendChild(fragment);
          }
          const nextCount = renderedCount + batchNew;
          // 更新这批新格子的内容
          syncUpdateGridRange(gridContainer, renderedCount, Math.min(gridIndex, nextCount), result);
          renderedCount = nextCount;

          if (renderedCount < numItems) {
            requestAnimationFrame(renderNextBatch);
          } else {
            // 所有格子创建完成，清空未使用的格子
            for (let i = gridIndex; i < gridContainer.children.length; i++) {
              const item = gridContainer.children[i];
              if (item.innerText !== '' || item.classList.length > 1 || item.dataset.sourceIndex) {
                item.innerText = '';
                item.removeAttribute('data-source-index');
                item.className = 'grid-item';
              }
            }
            isBatchRendering = false;
            throttledAddToUndoHistory(text);
            document.getElementById('error-message').style.display = 'none';
          }
        }

        requestAnimationFrame(renderNextBatch);

      } catch (error) {
        console.error("网格生成错误:", error);
        showError(`处理文本时发生错误: ${error.message}\n请检查特殊字符或简化文本`);
        document.getElementById('grid-container').innerHTML = '<div class="error">生成失败，请尝试简化文本</div>';
        isBatchRendering = false;
      }
    }

    // v7 fix: 撤销历史节流
    let undoThrottleTimer = null;
    let lastUndoCandidate = null;

    function throttledAddToUndoHistory(text) {
      lastUndoCandidate = text;
      clearTimeout(undoThrottleTimer);
      undoThrottleTimer = setTimeout(() => {
        addToUndoHistory(lastUndoCandidate);
      }, 400);
    }

    function addToUndoHistory(text) {
      if (undoHistory.length === 0 || undoHistory[undoHistory.length - 1] !== text) {
        undoHistory.push(text);
        if (undoHistory.length > MAX_UNDO_STEPS) { undoHistory.shift(); }
      }
    }

    function undo() {
      try {
        if (undoHistory.length < 2) { showError('无法撤销：历史记录不足'); return; }
        const inputTextDiv = document.getElementById('input-text');
        const caretPos = saveCaretPosition(inputTextDiv);
        undoHistory.pop();
        const prevText = undoHistory[undoHistory.length - 1];
        inputTextDiv.innerText = prevText;
        highlightDirectives();
        distributeText();
        restoreCaretPosition(inputTextDiv, caretPos);
      } catch (error) { showError(`撤销操作失败: ${error.message}`); }
    }

    function toggleAutoInput() {
      try {
        autoInputEnabled = !autoInputEnabled;
        const button = document.getElementById('toggle-auto-input');
        button.innerText = autoInputEnabled ? '自动输入·开' : '自动输入·关';
        if (autoInputEnabled) { button.classList.remove('auto-off'); button.classList.add('auto-on'); }
        else { button.classList.remove('auto-on'); button.classList.add('auto-off'); }
      } catch (error) { showError(`切换自动输入失败: ${error.message}`); }
    }

    function downloadText() {
      try {
        const text = document.getElementById('input-text').innerText;
        const firstLineEnd = text.indexOf('\n');
        let titleLine = firstLineEnd > -1 ? text.substring(0, firstLineEnd) : text;
        const cleanTitle = titleLine.replace(/\+\d+\+/g, '');
        const prefix = cleanTitle.substring(0, 25).replace(/[\n\r]/g, '');
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const now = new Date();
        const fileName = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}_${prefix}.txt`;
        const a = document.createElement('a');
        a.href = url; a.download = fileName;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
      } catch (error) {
        console.error("下载失败:", error);
        showError(`文件下载失败: ${error.message}\n请检查浏览器权限`);
      }
    }

    function importText() {
      try {
        const fileInput = document.createElement('input');
        fileInput.type = 'file'; fileInput.accept = '.txt';
        fileInput.onchange = function(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function(e) {
            try {
              let content = e.target.result;
              if (content.length > MAX_IMPORT_TEXT_LENGTH) {
                showError(`导入文件过大（${content.length} 字符），已截断至 ${MAX_IMPORT_TEXT_LENGTH} 字符`);
                content = content.substring(0, MAX_IMPORT_TEXT_LENGTH);
              }
              const inputTextDiv = document.getElementById('input-text');
              const caretPos = saveCaretPosition(inputTextDiv);
              inputTextDiv.innerText = content;
              highlightDirectives();
              distributeText();
              saveToLocalStorage();
              restoreCaretPosition(inputTextDiv, caretPos);
              showError(`成功导入文件: ${file.name}`);
            } catch (error) { showError(`导入文件失败: ${error.message}`); }
          };
          reader.onerror = function() { showError('读取文件失败，请检查文件格式'); };
          reader.readAsText(file);
        };
        fileInput.click();
      } catch (error) { showError(`导入功能出错: ${error.message}`); }
    }

    // 双击定位修复（20261013a，2026-10-13 真机反馈）：
    // innerText setter 会把换行符写入为 <br> 元素（载入 localStorage 存档 / 导入 / 清除系
    // 按钮均走此路径），而排版引擎的 sourceIndex 基于 innerText 坐标（每个 \n 计 1 字符）。
    // 此前实现只走文本节点、跳过 <br>，导致光标落点随前方换行数逐次偏后（前文正常、
    // 后文累积偏后）。现按 innerText 坐标遍历：<br> 计 1 字符，与引擎 sourceIndex 对齐。
    function findCaretPoint(container, position) {
      let total = 0;
      let found = null;
      (function visit(node) {
        if (found) return;
        for (const child of node.childNodes) {
          if (found) return;
          if (child.nodeType === Node.TEXT_NODE) {
            const length = child.nodeValue.length;
            if (position <= total + length) {
              found = { node: child, offset: position - total };
              return;
            }
            total += length;
          } else if (child.nodeType === Node.ELEMENT_NODE && child.tagName === 'BR') {
            if (position === total) {
              found = { beforeBr: child };
              return;
            }
            if (position <= total + 1) {
              found = { afterBr: child };
              return;
            }
            total += 1;
          } else if (child.nodeType === Node.ELEMENT_NODE) {
            visit(child);
          }
        }
      })(container);
      return found;
    }

    function setCaretToPosition(container, position) {
      const point = findCaretPoint(container, position);
      const range = document.createRange();
      if (point) {
        if (point.beforeBr !== undefined) { range.setStartBefore(point.beforeBr); }
        else if (point.afterBr !== undefined) { range.setStartAfter(point.afterBr); }
        else { range.setStart(point.node, point.offset); }
      } else {
        // 超出内容总长（含尾部换行）：置于容器末尾
        range.selectNodeContents(container);
        range.collapse(false);
      }
      range.collapse(true);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      container.focus();
      const highlight = document.createElement('span');
      highlight.className = 'cursor-highlight';
      highlight.appendChild(range.extractContents());
      range.insertNode(highlight);
      setTimeout(() => {
        if (highlight.parentNode) {
          const parent = highlight.parentNode;
          while (highlight.firstChild) { parent.insertBefore(highlight.firstChild, highlight); }
          parent.removeChild(highlight);
        }
      }, 1000);
    }

    function handleGridItemDoubleClick(event) {
      const gridItem = event.target;
      if (!gridItem.classList.contains('grid-item')) return;
      const sourceIndex = gridItem.dataset.sourceIndex;
      if (sourceIndex === undefined) return;
      const inputTextDiv = document.getElementById('input-text');
      inputTextDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setCaretToPosition(inputTextDiv, parseInt(sourceIndex));
      const range = document.createRange();
      const sel = window.getSelection();
      if (sel.rangeCount > 0) {
        range.setStart(sel.anchorNode, sel.anchorOffset);
        range.collapse(true);
        range.getClientRects();
        const rect = range.getBoundingClientRect();
        const containerRect = inputTextDiv.getBoundingClientRect();
        const newScrollTop = inputTextDiv.scrollTop + (rect.top - containerRect.top) - (containerRect.height / 2);
        inputTextDiv.scrollTo({ top: newScrollTop, behavior: 'smooth' });
      }
    }

    window.onload = function() {
      try {
        loadCountTarget();
        let savedText = null;
        try { savedText = localStorage.getItem('savedText'); }
        catch (e) { console.warn('无法读取本地存储:', e.message); }
        const inputTextDiv = document.getElementById('input-text');
        const defaultText = DEFAULT_TEXT;
        if (savedText) { inputTextDiv.innerText = savedText; }
        else { inputTextDiv.innerText = defaultText; }
        const gridContainer = document.getElementById('grid-container');
        inputTextDiv.addEventListener('focus', () => gridContainer.classList.add('focus-highlight'));
        inputTextDiv.addEventListener('blur', () => gridContainer.classList.remove('focus-highlight'));
        document.getElementById('grid-container').addEventListener('dblclick', handleGridItemDoubleClick);
        if (typeof ResizeObserver !== 'undefined') {
          const resizeObserver = new ResizeObserver(() => {
            isResizing = true;
            clearTimeout(resizeEndTimeout);
            resizeEndTimeout = setTimeout(() => {
              isResizing = false;
              if (autoInputEnabled) { distributeTextWithDelay(); }
            }, 200);
          });
          resizeObserver.observe(inputTextDiv);
        }
        requestAnimationFrame(() => {
          try { highlightDirectives(); } catch (e) { console.warn('高亮指令失败:', e.message); }
          requestAnimationFrame(() => {
            try { distributeText(); } catch (e) { console.warn('初始渲染失败:', e.message); }
          });
        });
      } catch (error) { showError(`加载失败: ${error.message}`); }
    };

    function adjustTextarea(action) {
      try {
        const inputTextDiv = document.getElementById('input-text');
        const step = 20;
        const currentWidth = parseInt(window.getComputedStyle(inputTextDiv).width, 10);
        const currentHeight = parseInt(window.getComputedStyle(inputTextDiv).height, 10);
        if (action === 'narrow') { inputTextDiv.style.width = `${Math.max(100, currentWidth - step)}px`; }
        else if (action === 'wide') { inputTextDiv.style.width = `${currentWidth + step}px`; }
        else if (action === 'short') { inputTextDiv.style.height = `${Math.max(100, currentHeight - step)}px`; }
        else if (action === 'tall') { inputTextDiv.style.height = `${currentHeight + step}px`; }
      } catch (error) { showError(`调整文本框大小失败: ${error.message}`); }
    }

    function adjustFontSize(delta) {
      try {
        const root = document.documentElement;
        const current = parseFloat(getComputedStyle(root).getPropertyValue('--content-font-size')) || 18;
        const newSize = Math.max(12, Math.min(32, current + delta));
        root.style.setProperty('--content-font-size', newSize + 'px');
      } catch (error) { showError(`调整字号失败: ${error.message}`); }
    }

    function resetTextarea() {
      try {
        const inputTextDiv = document.getElementById('input-text');
        inputTextDiv.style.width = initialWidth;
        inputTextDiv.style.height = initialHeight;
      } catch (error) { showError(`重置文本框失败: ${error.message}`); }
    }

    let countTarget = 0;

    function updateCountTarget() {
      const input = document.getElementById('count-target');
      const val = parseInt(input.value, 10);
      countTarget = isNaN(val) || val < 0 ? 0 : val;
      try {
        if (countTarget > 0) { localStorage.setItem('countTarget', String(countTarget)); }
        else { localStorage.removeItem('countTarget'); }
      } catch (e) { console.warn('无法保存字数目标:', e.message); }
      const countDisplay = document.getElementById('count-display');
      const currentText = countDisplay.innerText;
      const match = currentText.match(/表格计数:\s*(\d+)/);
      if (match) { updateCountDisplay(parseInt(match[1], 10)); }
    }

    function loadCountTarget() {
      try {
        const saved = localStorage.getItem('countTarget');
        if (saved) {
          countTarget = parseInt(saved, 10);
          const input = document.getElementById('count-target');
          if (input) input.value = countTarget;
        }
      } catch (e) { console.warn('无法读取字数目标:', e.message); }
    }

    function updateCountDisplay(gridIndex) {
      const countDisplay = document.getElementById('count-display');
      if (!countDisplay) return;
      if (countTarget > 0) {
        const pct = Math.round((gridIndex / countTarget) * 100);
        const over = gridIndex > countTarget;
        countDisplay.innerText = `表格计数: ${gridIndex} / ${countTarget} (${pct}%)`;
        if (over) { countDisplay.classList.add('over-target'); }
        else { countDisplay.classList.remove('over-target'); }
      } else {
        countDisplay.innerText = `表格计数: ${gridIndex}`;
        countDisplay.classList.remove('over-target');
      }
    }
    // ESM module 作用域内的函数挂到 window，保持既有内联事件处理器（onclick 等）零改动
    Object.assign(window, {
      resetTextarea, adjustTextarea, adjustFontSize,
      distributeTextWithDelay, handleKeyDown, distributeText, highlightDirectives,
      clearPlusN, clearNewLines, clearSpaces, clearInput,
      undo, toggleAutoInput, downloadText, importText, updateCountTarget
    });
  </script>
</body>
</html>
